<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anchor Sync — FFB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #faf9f7;
    --ink: #1c1a17;
    --sub: #6b645a;
    --accent: #8a5a36;
    --line: #ddd6cb;
    --panel: #ffffff;
    --ok: #2e6b3e;
    --warn: #9a5a1a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f; --ink: #f1ece2; --sub: #b7ae9e; --accent: #d59a63;
      --line: #3a352c; --panel: #201c16; --ok: #6fbf7f; --warn: #e0a24a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f; --ink: #f1ece2; --sub: #b7ae9e; --accent: #d59a63;
    --line: #3a352c; --panel: #201c16; --ok: #6fbf7f; --warn: #e0a24a;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
    line-height: 1.8;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .lead { color: var(--sub); margin: 0 0 32px; font-size: 0.95rem; }
  .step {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; margin-bottom: 18px;
  }
  .step h2 {
    font-size: 1rem; margin: 0 0 12px; display: flex; align-items: center; gap: 10px;
  }
  .num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%; background: var(--accent);
    color: #fff; font-size: 0.8rem; flex-shrink: 0;
  }
  input[type=file] {
    width: 100%; padding: 10px; border: 1px dashed var(--line); border-radius: 8px;
    background: transparent; color: var(--ink); font-family: inherit;
  }
  .filename { font-size: 0.85rem; color: var(--sub); margin-top: 6px; min-height: 1.2em; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 12px 22px; font-size: 1rem; font-family: inherit; cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  #report {
    display: none; margin-top: 18px; padding: 16px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--line); font-size: 0.9rem;
    white-space: pre-wrap; direction: ltr; text-align: left; font-family: Consolas, monospace;
    max-height: 260px; overflow-y: auto;
  }
  #summary { font-family: inherit; direction: var(--dir, ltr); margin-bottom: 10px; }
  .langbar { display:flex; justify-content:flex-end; gap:6px; margin-bottom:10px; }
  .langbar button { width:auto; padding:4px 12px; font-size:0.85rem; }
  .langbar button.on { background: var(--accent); color:#fff; }
  #summary b.ok { color: var(--ok); }
  #summary b.warn { color: var(--warn); }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar"><button class="secondary" id="langEn">English</button><button class="secondary" id="langFa">فارسی</button></div>
  <h1 data-i="title">Anchor Sync — FFB</h1>
  <p class="lead" data-i="lead"></p>

  <div class="step">
    <h2><span class="num">1</span> <span data-i="step1"></span></h2>
    <p class="lead" style="margin:0 0 10px;" data-i="hint"></p>
    <input type="file" id="ufoInput" accept=".zip">
    <div class="filename" id="ufoName"></div>
  </div>

  <div class="step">
    <button id="runBtn" disabled data-i="run"></button>
    <div id="report"></div>
    <div class="hidden" id="resultBox" style="margin-top:14px;">
      <label style="font-size:0.85rem;color:var(--sub);display:block;margin-bottom:6px;" data-i="result"></label>
      <textarea id="resultArea" readonly style="width:100%;height:220px;direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:0.85rem;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);"></textarea>
      <div class="actions" style="margin-top:10px;">
        <button id="copyBtn" class="secondary" data-i="copy"></button>
        <button id="downloadBtn" data-i="download"></button>
      </div>
    </div>
  </div>
</div>

<script>
const STR = {
  en: {
    title: "Anchor Sync — FFB",
    lead: "Reads the current anchor coordinates from a UFO file and writes them into the GPOS feature file, without changing the structure.",
    step1: "UFO file (as .zip)",
    hint: "The GPOS feature is read from the same file — no separate feature file needed.",
    run: "Synchronize", busy: "Processing...",
    result: "Result (you can copy it directly from here):",
    copy: "Copy all", copied: "Copied ✓", download: "Download file",
    zipErr: "Could not read the zip: ",
    noFea: "<b class=\"warn\">features.fea was not found in this UFO.</b> Make sure the zip contains the .ufo folder with features.fea inside.",
    updated: (n) => `<b class="ok">${n}</b> anchor value(s) updated.`,
    missing: (n) => ` <b class="warn">${n}</b> not found in the UFO (left unchanged).`,
    missingHead: "Not found:", err: "Error:"
  },
  fa: {
    title: "همگام‌سازِ انکرهای UFO با فیچرِ GPOS",
    lead: "مختصاتِ انکرهای فعلیِ فونت‌تون رو از UFO می‌خونه و همون اعداد رو، بدون دست‌زدن به ساختار، جای اعدادِ قدیمی توی فایلِ GPOS می‌ذاره.",
    step1: "فایلِ UFO (به‌صورت zip)",
    hint: "فیچرِ GPOS رو خودش از همین فایل درمی‌آره — نیازی به فایلِ جدا نیست.",
    run: "همگام‌سازی کن", busy: "در حال پردازش...",
    result: "نتیجه (برای اطمینان، می‌تونید مستقیم از همینجا کپی کنید):",
    copy: "کپیِ همه", copied: "کپی شد ✓", download: "دانلودِ فایل",
    zipErr: "خطا در خواندنِ zip: ",
    noFea: "<b class=\"warn\">فایلِ features.fea داخلِ این UFO پیدا نشد.</b> مطمئن بشید فایل zip حاویِ پوشه‌ی .ufo با features.fea داخلش هست.",
    updated: (n) => `<b class="ok">${n}</b> مقدارِ انکر به‌روزرسانی شد.`,
    missing: (n) => ` <b class="warn">${n}</b> مورد در UFO پیدا نشد (بدون تغییر باقی موند).`,
    missingHead: "موارد پیدا‌نشده:", err: "خطا:"
  }
};
let LANG = (navigator.language || 'en').toLowerCase().startsWith('fa') ? 'fa' : 'en';
const T = (k, ...a) => { const v = STR[LANG][k]; return typeof v === 'function' ? v(...a) : v; };
function setLang(l) {
  LANG = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
  document.documentElement.style.setProperty('--dir', l === 'fa' ? 'rtl' : 'ltr');
  document.title = T('title');
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = T(el.dataset.i); });
  document.getElementById('langEn').classList.toggle('on', l === 'en');
  document.getElementById('langFa').classList.toggle('on', l === 'fa');
}
let ufoZip = null;
let resultText = null;
let resultFilename = "synced.fea";

const ufoInput = document.getElementById('ufoInput');
const runBtn = document.getElementById('runBtn');
const reportEl = document.getElementById('report');
const resultBox = document.getElementById('resultBox');
const resultArea = document.getElementById('resultArea');
const copyBtn = document.getElementById('copyBtn');
const downloadBtn = document.getElementById('downloadBtn');

ufoInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('ufoName').textContent = file.name;
  resultFilename = file.name.replace(/\.zip$/i, '') + '.synced.fea';
  try {
    ufoZip = await JSZip.loadAsync(file);
    runBtn.disabled = false;
  } catch (err) {
    document.getElementById('ufoName').textContent = T('zipErr') + err.message;
    ufoZip = null;
    runBtn.disabled = true;
  }
});

function parseAnchorsFromGlif(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  const glyphEl = doc.querySelector('glyph');
  if (!glyphEl) return null;
  const name = glyphEl.getAttribute('name');
  const anchors = [];
  doc.querySelectorAll('anchor').forEach(a => {
    const aname = a.getAttribute('name');
    if (!aname) return;
    anchors.push({
      name: aname,
      x: parseFloat(a.getAttribute('x') || '0'),
      y: parseFloat(a.getAttribute('y') || '0'),
    });
  });
  return { name, anchors };
}

// Same renaming rules as src/normalize_anchors.py, so that FontLab's anchor
// names (t.fatha.mrk, _T.mrk, T, D, R, S, E, ...) are matched to the slot
// names used in the feature code (Tm, _Tm, bar, ring, sarkesh, Ex, ...).
const BASE_RULES = [
  [/^[tbm]\.sarkesh\.mrk(?:\.skl)?((?:_\d+)*)$/, 'sarkesh$1'],
  [/^[tbm]\.bar\.mrk(?:\.skl)?(?:_\d+)*$/, 'bar'],
  [/^t\..+\.mrk(?:\.skl)?((?:_\d+)*)$/, 'Tm$1'],
  [/^t\..+\.mrk\.skl\.\d+$/, 'Tm'],
  [/^b\..+\.mrk(?:\.skl)?((?:_\d+)*)$/, 'Bm$1'],
  [/^ring$/, 'ring'],
  [/^m\.ring\.mrk((?:_\d+)*)$/, 'ring$1'],
  [/^E$/, 'Ex'],
];
const MARK_SIDE_RULES = BASE_RULES.map(([re, r]) => [new RegExp('^_' + re.source.slice(1), re.flags), '_' + r]);
const EXTRA_MARK_RULES = [
  [/^_T\.(?:mrk|mek)((?:_\d+)*)$/, '_Tm$1'],
  [/^_B\.(?:mrk|mek)((?:_\d+)*)$/, '_Bm$1'],
];
const SLOT_LETTER_RULES = [];
for (const [letter, slot] of [['T', 'Tm'], ['B', 'Bm'], ['D', 'bar'], ['R', 'ring'], ['S', 'sarkesh']]) {
  SLOT_LETTER_RULES.push([new RegExp('^_' + letter + '$'), '_' + slot]);
  SLOT_LETTER_RULES.push([new RegExp('^' + letter + '$'), slot]);
}
const ALL_RULES = [...EXTRA_MARK_RULES, ...MARK_SIDE_RULES, ...BASE_RULES, ...SLOT_LETTER_RULES];
function normalizeName(name) {
  for (const [re, repl] of ALL_RULES) if (re.test(name)) return name.replace(re, repl);
  return name;
}
const CANON = "\u0001canon\u0001";

async function buildAnchorMap(zip) {
  const map = new Map();
  const glifPaths = Object.keys(zip.files).filter(p => /\/glyphs\/[^/]+\.glif$/i.test(p) && !zip.files[p].dir);
  for (const path of glifPaths) {
    const text = await zip.files[path].async('string');
    const parsed = parseAnchorsFromGlif(text);
    if (!parsed || !parsed.name) continue;
    for (const a of parsed.anchors) {
      map.set(parsed.name + "\u0000" + a.name, { x: a.x, y: a.y });
    }
  }
  // Canonical aliases (exact names always win; aliases fill the gaps).
  for (const [key, val] of Array.from(map.entries())) {
    const i = key.indexOf("\u0000");
    const glyph = key.slice(0, i), name = key.slice(i + 1);
    const ck = glyph + "\u0000" + CANON + normalizeName(name);
    if (!map.has(ck)) map.set(ck, val);
  }
  return map;
}

function lookupAnchor(anchorMap, glyph, name) {
  return anchorMap.get(glyph + "\u0000" + name)
      || anchorMap.get(glyph + "\u0000" + CANON + normalizeName(name));
}

function findFeaturesFile(zip) {
  const path = Object.keys(zip.files).find(p => /(^|\/)features\.fea$/i.test(p) && !zip.files[p].dir);
  return path || null;
}

function syncFeaText(text, anchorMap) {
  let updated = 0;
  const missing = [];

  const markClassRe = /(markClass\s+(\S+)\s+<anchor\s+)(-?\d+)\s+(-?\d+)(>\s*@(\w+)\s*;)/g;
  text = text.replace(markClassRe, (m, prefix, glyph, ox, oy, suffix, slot) => {
    const a = lookupAnchor(anchorMap, glyph, "_" + slot);
    if (!a) { missing.push(glyph + " : _" + slot); return m; }
    updated++;
    return prefix + Math.round(a.x) + " " + Math.round(a.y) + suffix;
  });

  const posBaseRe = /(pos\s+(?:base|mark)\s+(\S+)\s+<anchor\s+)(-?\d+)\s+(-?\d+)(>\s*mark\s*@(\w+))/g;
  text = text.replace(posBaseRe, (m, prefix, glyph, ox, oy, suffix, slot) => {
    const a = lookupAnchor(anchorMap, glyph, slot);
    if (!a) { missing.push(glyph + " : " + slot); return m; }
    updated++;
    return prefix + Math.round(a.x) + " " + Math.round(a.y) + suffix;
  });

  // Cursive attachment: pos cursive <glyph> <entry> <exit>;  entry = _Ex, exit = Ex.
  // <anchor NULL> stays NULL (structure is never changed).
  const ANCH = '(?:<anchor\\s+NULL>|<anchor\\s+-?\\d+\\s+-?\\d+>)';
  const cursRe = new RegExp('(pos\\s+cursive\\s+(\\S+)\\s+)(' + ANCH + ')(\\s+)(' + ANCH + ')', 'g');
  const coordRe = /^<anchor\s+-?\d+\s+-?\d+>$/;
  const syncOne = (anchorText, glyph, names) => {
    if (!coordRe.test(anchorText)) return anchorText;
    for (const n of names) {
      const a = lookupAnchor(anchorMap, glyph, n);
      if (a) { updated++; return '<anchor ' + Math.round(a.x) + ' ' + Math.round(a.y) + '>'; }
    }
    missing.push(glyph + " : " + names[0]);
    return anchorText;
  };
  text = text.replace(cursRe, (m, head, glyph, entry, gap, exit) =>
    head + syncOne(entry, glyph, ['_Ex', '_E']) + gap + syncOne(exit, glyph, ['Ex', 'E']));

  return { text, updated, missing };
}

runBtn.addEventListener('click', async () => {
  runBtn.disabled = true;
  runBtn.textContent = T('busy');
  reportEl.style.display = 'block';
  resultBox.classList.add('hidden');
  try {
    const featuresPath = findFeaturesFile(ufoZip);
    if (!featuresPath) {
      reportEl.innerHTML = T('noFea');
      runBtn.disabled = false;
      runBtn.textContent = T('run');
      return;
    }
    const feaText = await ufoZip.files[featuresPath].async('string');
    const anchorMap = await buildAnchorMap(ufoZip);
    const { text, updated, missing } = syncFeaText(feaText, anchorMap);
    resultText = text;

    let summary = `<div id="summary">` + T('updated', updated);
    if (missing.length) {
      summary += T('missing', missing.length);
    }
    summary += `</div>`;
    let detail = missing.length ? T('missingHead') + "\n" + missing.map(m => "  - " + m).join("\n") : "";
    reportEl.innerHTML = summary + (detail ? `<div>${detail.replace(/\n/g,'<br>')}</div>` : '');

    resultArea.value = resultText;
    resultBox.classList.remove('hidden');
  } catch (err) {
    reportEl.innerHTML = '<b class="warn">' + T('err') + '</b> ' + err.message;
  }
  runBtn.disabled = false;
  runBtn.textContent = T('run');
});

copyBtn.addEventListener('click', async () => {
  resultArea.select();
  try {
    await navigator.clipboard.writeText(resultText);
    copyBtn.textContent = T('copied');
    setTimeout(() => copyBtn.textContent = T('copy'), 1500);
  } catch (e) {
    // selection alone lets the user press Ctrl+C manually
  }
});

downloadBtn.addEventListener('click', async () => {
  if (!resultText) return;
  // Standalone use (GitHub copy): normal browser download.
  try {
    const blob = new Blob([resultText], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = resultFilename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) { /* the textarea above always works */ }
});
document.getElementById('langEn').addEventListener('click', () => setLang('en'));
document.getElementById('langFa').addEventListener('click', () => setLang('fa'));
setLang(LANG);
</script>
</body>
</html>
